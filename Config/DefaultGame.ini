; GAS 战斗桥接插件 —— 技能激活失败原因的上报配置
;
; ============================================================================
;  【重要 · 这个文件现在不参与运行】
;
;  引擎**不会**把插件 Config 目录里的 ini 并进 GameplayAbilities 的配置层级里：
;  UGameplayAbilitiesDeveloperSettings 是 UCLASS(config=Game) 且位于引擎的
;  GameplayAbilities 插件中，它读 DefaultGame.ini 时只走「引擎/工程/用户」三层，
;  只有「插件自己的 settings 类」才会额外走 {PLUGIN}/Config/Default{TYPE}.ini 那一层。
;
;  也就是说：把设置写在这里，表面上很合理，实际**一条都不会生效**，
;  而且没有任何报错 —— 这是典型的"静默失效"。
;
;  所以插件改成在 C++ 里做（GASCombatBridge.cpp 的 ApplyActivateFailTagDefaults）：
;  启动时检查这几项，为空就补上默认值，使用者已经在项目设置里配过的一律不覆盖。
;
;  这个文件保留下来只作两个用途：
;    1. 告诉你默认映射关系是什么
;    2. 如果你想把这些值并进**自己工程**的 Config/DefaultGame.ini，直接复制下面的段落
; ============================================================================
;
; 引擎默认这几个标签是空的，所以技能激活失败时 GAS 不会附带任何原因 —— 只能靠猜。
; 接上之后，配合本插件的「技能激活失败时」事件，
; 「技能为什么放不出来」就从「靠猜」变成「有明确中文提示」。
;
; 这些设置等同于：
;   项目设置 → Gameplay Abilities Settings → 各个 Activate Fail 标签项
; 项目设置里的值优先级高于插件的默认值。

[/Script/GameplayAbilities.GameplayAbilitiesDeveloperSettings]
ActivateFailCanActivateAbilityTag=(TagName="Activation.Fail.CanActivateAbility")
ActivateFailCooldownTag=(TagName="Activation.Fail.OnCooldown")
ActivateFailCostTag=(TagName="Activation.Fail.CantAffordCost")
ActivateFailNetworkingTag=(TagName="Activation.Fail.Networking")
ActivateFailTagsBlockedTag=(TagName="Activation.Fail.BlockedByTags")
ActivateFailTagsMissingTag=(TagName="Activation.Fail.MissingTags")
