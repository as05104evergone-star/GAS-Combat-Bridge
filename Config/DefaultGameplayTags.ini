; GAS 战斗桥接插件 —— 自带 Gameplay 标签
;
; ============================================================================
;  【重要 · 这个文件现在不参与运行】
;
;  引擎**不会**把插件 Config 目录里的 ini 并进 GameplayTags 模块的配置层级里：
;  UGameplayTagsSettings 是 UCLASS(config=GameplayTags) 且位于引擎的 GameplayTags 模块中，
;  它读 DefaultGameplayTags.ini 时只走「引擎/工程/用户」三层，
;  只有「插件自己的 settings 类」才会额外走 {PLUGIN}/Config/Default{TYPE}.ini 那一层。
;
;  也就是说：把标签写在这里，表面上很合理，实际**一条都不会注册**，
;  而且没有任何报错 —— 症状是「SetCaller 键选不到标签」「技能激活失败没有原因」，全都静默。
;
;  所以插件改成在 C++ 里原生注册（GASCombatBridge.cpp 的 RegisterCombatTags）：
;  启动时逐个检查，项目里没有的就用 AddNativeGameplayTag 注册。
;  项目里已经自己配过的同名标签不会被覆盖。
;
;  这个文件保留下来只作两个用途：
;    1. 告诉你插件会注册哪些标签、各自的含义
;    2. 如果你想把这些标签并进**自己工程**的 Config/DefaultGameplayTags.ini，直接复制下面的行
; ============================================================================

[/Script/GameplayTags.GameplayTagsSettings]

; ---------------------------------------------------------------------------
;  数值传递标签（配合 GameplayEffect 的「SetByCaller」数值类型使用）
; ---------------------------------------------------------------------------
+GameplayTagList=(Tag="Data.Damage",DevComment="伤害数值。效果里把修饰符数值类型设为 SetByCaller，键选这个标签，「对目标造成伤害」节点会自动把伤害值填进来")
+GameplayTagList=(Tag="Data.Healing",DevComment="治疗数值。用法同 Data.Damage")
+GameplayTagList=(Tag="Data.Duration",DevComment="持续时长。用于运行时决定一个效果持续几秒，例如按蓄力时间决定灼烧时长")
+GameplayTagList=(Tag="Data.Combo.Advance",DevComment="连招段数增量。把 GameplayEffect 的修饰符数值类型设为 SetByCaller、键选这个标签，即可用同一个效果承担 起手+1 / 推进+1 / 打满绕回-2 / 收尾归零-N 四种语义")

; ---------------------------------------------------------------------------
;  技能激活失败原因标签
;
;  这些标签本身不产生任何玩法效果，它们的作用是让引擎在拒绝激活技能时
;  「说出理由」。没有它们的话，技能放不出来是完全静默的，你只能靠猜。
;
;  配置好之后：
;    - 桥接组件的「技能激活失败时」事件会给出中文原因
;    - 控制台 showdebug abilitysystem 也会显示失败标签
; ---------------------------------------------------------------------------
+GameplayTagList=(Tag="Activation.Fail.CanActivateAbility",DevComment="技能自身的 CanActivateAbility 检查未通过")
+GameplayTagList=(Tag="Activation.Fail.CantAffordCost",DevComment="消耗不足（蓝量/资源不够）")
+GameplayTagList=(Tag="Activation.Fail.OnCooldown",DevComment="技能正在冷却中")
+GameplayTagList=(Tag="Activation.Fail.BlockedByTags",DevComment="被「阻止他人技能」类标签挡下（眩晕/沉默/硬直）")
+GameplayTagList=(Tag="Activation.Fail.MissingTags",DevComment="缺少技能要求的「激活所需标签」")
+GameplayTagList=(Tag="Activation.Fail.Networking",DevComment="网络执行策略不允许在当前端激活")
+GameplayTagList=(Tag="Activation.Fail.IsDead",DevComment="角色已死亡")

; ---------------------------------------------------------------------------
;  常用战斗状态标签（示例，可按需删改）
;  留着它们是为了让你一开始就有东西可以试；正式项目请按自己的命名规范整理。
; ---------------------------------------------------------------------------
+GameplayTagList=(Tag="State.Dead",DevComment="已死亡")
+GameplayTagList=(Tag="State.Stunned",DevComment="被眩晕，通常配合「阻止他人技能」使用")
+GameplayTagList=(Tag="State.Invulnerable",DevComment="无敌帧")
+GameplayTagList=(Tag="State.Attacking",DevComment="正在攻击，常用于「攻击中不能再次攻击」")
+GameplayTagList=(Tag="Cooldown.Skill",DevComment="技能冷却标签的父标签。每个技能的冷却效果应授予 Cooldown.Skill.<技能名> 这样的唯一子标签")
